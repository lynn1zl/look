<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>외관표 니니닝!</title>
<meta name="description" content="외관표 니니닝! — 전신 · 두상 이미지와 머리색 · 눈색, 특징을 넣어 캐릭터 외관표를 이미지로 저장하는 사이트">
<meta property="og:title" content="외관표 니니닝!">
<meta property="og:description" content="이미지를 끌어다 놓기만 하면 완성되는 캐릭터 외관표">
<meta name="theme-color" content="#f2f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101012" media="(prefers-color-scheme: dark)">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233182f6'/%3E%3Cg fill='%23fff' transform='translate(6 5) scale(2.17)'%3E%3Cellipse cx='8.4' cy='7.2' rx='2.4' ry='5.6' transform='rotate(-12 8.4 7.2)'/%3E%3Cellipse cx='15.6' cy='7.2' rx='2.4' ry='5.6' transform='rotate(12 15.6 7.2)'/%3E%3Cellipse cx='12' cy='15.4' rx='7' ry='6.3'/%3E%3Ccircle cx='9.4' cy='14.8' r='1' fill='%233182f6'/%3E%3Ccircle cx='14.6' cy='14.8' r='1' fill='%233182f6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%233182f6'/%3E%3Cg fill='%23fff' transform='translate(6 5) scale(2.17)'%3E%3Cellipse cx='8.4' cy='7.2' rx='2.4' ry='5.6' transform='rotate(-12 8.4 7.2)'/%3E%3Cellipse cx='15.6' cy='7.2' rx='2.4' ry='5.6' transform='rotate(12 15.6 7.2)'/%3E%3Cellipse cx='12' cy='15.4' rx='7' ry='6.3'/%3E%3Ccircle cx='9.4' cy='14.8' r='1' fill='%233182f6'/%3E%3Ccircle cx='14.6' cy='14.8' r='1' fill='%233182f6'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable.min.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name">외관표 니니닝!</span>
    </div>

    <div class="seg" id="mode-seg" role="radiogroup" aria-label="인원">
      <button type="button" role="radio" data-mode="2">2인</button>
      <button type="button" role="radio" data-mode="1">1인</button>
      <span class="seg-thumb" aria-hidden="true"></span>
    </div>
    <button type="button" class="chip-toggle" id="btn-rel" aria-pressed="true" title="가운데 관계성(서로를 어떻게 생각하는지) 칸 켜고 끄기">
      <span class="chip-check" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg></span>관계성
    </button>

    <div class="appbar-right">
      <button type="button" class="icon-btn" id="btn-swap" title="좌우 캐릭터 바꾸기" aria-label="좌우 캐릭터 바꾸기"></button>
      <div class="pop-wrap">
        <button type="button" class="icon-btn" id="btn-design" title="디자인" aria-label="디자인" aria-haspopup="true"></button>
        <div class="pop" id="pop-design" hidden>
          <div class="pop-title">배경</div>
          <div class="theme-list" id="theme-list">
            <button type="button" data-theme="white"><span class="theme-chip t-white"></span>화이트</button>
            <button type="button" data-theme="cloud"><span class="theme-chip t-cloud"></span>클라우드</button>
            <button type="button" data-theme="dark"><span class="theme-chip t-dark"></span>다크</button>
          </div>
          <div class="pop-title">포인트 색</div>
          <div class="accent-list" id="accent-list"></div>
          <div class="pop-title">저장 화질</div>
          <div class="seg seg-sm" id="scale-seg" role="radiogroup" aria-label="저장 화질">
            <button type="button" role="radio" data-scale="1">1×</button>
            <button type="button" role="radio" data-scale="2">2×</button>
            <button type="button" role="radio" data-scale="3">3×</button>
            <span class="seg-thumb" aria-hidden="true"></span>
          </div>
        </div>
      </div>
      <div class="pop-wrap">
        <button type="button" class="icon-btn" id="btn-more" title="더 보기" aria-label="더 보기" aria-haspopup="true"></button>
        <div class="pop menu" id="pop-more" hidden>
          <button type="button" data-act="swap" class="narrow-only" id="menu-swap">좌우 캐릭터 바꾸기</button>
          <div class="menu-sep narrow-only"></div>
          <button type="button" data-act="export">작업 파일로 내보내기</button>
          <label>작업 파일 불러오기<input type="file" id="file-import" accept="application/json,.json" hidden></label>
          <div class="menu-sep"></div>
          <button type="button" data-act="reset" class="danger">초기화…</button>
        </div>
      </div>
      <button type="button" class="btn btn-soft" id="btn-copy" title="이미지를 클립보드에 복사">
        <span class="btn-icon" data-icon="copy"></span><span class="btn-label">복사</span>
      </button>
      <button type="button" class="btn btn-primary" id="btn-save" title="이미지 저장 (Ctrl/⌘ + S)">
        <span class="btn-icon" data-icon="download"></span><span class="btn-label">이미지 저장</span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="stage-inner" id="stage-inner">
      <div class="scaler" id="scaler">
        <div class="sheet" id="sheet"></div>
      </div>
    </div>
    <p class="stage-hint" id="stage-hint">칸을 눌러 바로 입력하세요 · 이미지는 끌어다 놓기, 클릭, <kbd>Ctrl/⌘ + V</kbd> 붙여넣기</p>
  </main>

  <div class="zoom" id="zoom">
    <button type="button" class="zoom-btn" data-zoom="out" aria-label="축소"></button>
    <button type="button" class="zoom-val" data-zoom="fit" id="zoom-val" title="화면에 맞추기">100%</button>
    <button type="button" class="zoom-btn" data-zoom="in" aria-label="확대"></button>
  </div>
</div>

<input type="file" id="file-img" accept="image/*" hidden>
<input type="color" id="color-input" tabindex="-1" aria-hidden="true">

<div class="cpop" id="cpop" role="dialog" aria-label="색 고르기" hidden>
  <div class="cp-head"><span class="cp-preview" id="cp-preview"></span><span class="cp-title" id="cp-title">머리색</span></div>
  <div class="seg seg-sm" id="cp-type" role="radiogroup" aria-label="칠하는 방식">
    <button type="button" role="radio" data-type="solid">단색</button>
    <button type="button" role="radio" data-type="linear">직선</button>
    <button type="button" role="radio" data-type="radial">원형</button>
    <button type="button" role="radio" data-type="split">투톤</button>
    <span class="seg-thumb" aria-hidden="true"></span>
  </div>
    <div class="cp-stop" data-stop="a">
      <label class="cp-chip"><input type="color" aria-label="첫 번째 색"></label>
      <div class="cp-field"><span class="cp-lab">첫 번째 색</span><input class="cp-hex" type="text" maxlength="24" spellcheck="false" autocomplete="off" aria-label="첫 번째 색 컬러코드"></div>
      <button type="button" class="cp-drop" title="화면에서 색 뽑기" aria-label="스포이트" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6.5 3 3M4 20l1-4 9-9 3 3-9 9-4 1Z"/><path d="m13 5 2-2a2.1 2.1 0 0 1 3 0l3 3a2.1 2.1 0 0 1 0 3l-2 2"/></svg></button>
    </div>
    <div class="cp-stop" data-stop="b">
      <label class="cp-chip"><input type="color" aria-label="두 번째 색"></label>
      <div class="cp-field"><span class="cp-lab">두 번째 색</span><input class="cp-hex" type="text" maxlength="24" spellcheck="false" autocomplete="off" aria-label="두 번째 색 컬러코드"></div>
      <button type="button" class="cp-drop" title="화면에서 색 뽑기" aria-label="스포이트" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14.5 6.5 3 3M4 20l1-4 9-9 3 3-9 9-4 1Z"/><path d="m13 5 2-2a2.1 2.1 0 0 1 3 0l3 3a2.1 2.1 0 0 1 0 3l-2 2"/></svg></button>
    </div>
  <div class="cp-angle" id="cp-angle-row"><span>방향</span><input type="range" id="cp-angle" min="0" max="360" step="5" aria-label="방향"><b id="cp-angle-val">135°</b></div>
  <button type="button" class="cp-link" id="cp-flip">두 색 순서 바꾸기</button>
  <label class="switch-row" id="cp-eye2-row"><span>눈색 두 칸 <small>오드아이</small></span><input type="checkbox" class="switch" id="cp-eye2"></label>
  <button type="button" class="cp-link danger" id="cp-del-eye2">이 눈색 칸 지우기</button>
</div>

<div class="modal" id="modal-draw" hidden>
  <div class="modal-card draw-card" role="dialog" aria-modal="true" aria-labelledby="draw-title">
    <h2 id="draw-title">동그라미 꾸미기</h2>
    <p class="draw-sub">마우스나 손가락으로 바로 그려요. 그림이 없으면 글자가 보여요.</p>
    <div class="draw-stage" id="draw-stage">
      <canvas id="draw-cv" width="600" height="600"></canvas>
      <svg class="draw-guide" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8v84M8 48h84" /><ellipse cx="50" cy="52" rx="30" ry="34"/></svg>
    </div>
    <div class="draw-row">
      <div class="pen-colors" id="pen-colors"></div>
      <div class="pen-sizes" id="pen-sizes">
        <button type="button" data-size="6" aria-label="가는 펜"><i style="--s:5px"></i></button>
        <button type="button" data-size="12" aria-label="중간 펜"><i style="--s:9px"></i></button>
        <button type="button" data-size="22" aria-label="굵은 펜"><i style="--s:14px"></i></button>
      </div>
    </div>
    <div class="draw-acts">
      <button type="button" data-draw="face">기본 얼굴</button>
      <button type="button" data-draw="eraser">지우개</button>
      <button type="button" data-draw="undo">되돌리기</button>
      <button type="button" data-draw="clear">전체 지우기</button>
    </div>
    <div class="draw-opt"><span>배경</span><div class="bg-list" id="bg-list"></div></div>
    <div class="draw-opt"><span>글자</span><input id="draw-letter" class="draw-letter" maxlength="2" placeholder="A" autocomplete="off"></div>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>취소</button><button type="button" class="btn btn-primary" id="draw-done">완료</button></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="modal" id="modal-reset" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="reset-title">
    <h2 id="reset-title">무엇을 초기화할까요?</h2>
    <div class="reset-list">
      <button type="button" class="reset-opt" data-reset="0">왼쪽 캐릭터</button>
      <button type="button" class="reset-opt" data-reset="1">오른쪽 캐릭터</button>
      <button type="button" class="reset-opt danger" data-reset="all">전부 지우기</button>
    </div>
    <div class="modal-actions"><button type="button" class="btn btn-ghost" data-close>취소</button></div>
  </div>
</div>

<script src="lib/html-to-image.js"></script>
<script src="app.js"></script>
</body>
</html>
